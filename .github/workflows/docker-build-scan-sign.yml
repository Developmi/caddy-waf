name: Build, Scan, Sign, and Push

on:
  push:
    tags: ["v*"]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: developmi/caddy-waf

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Releases must never be cut mid-flight; a newer run on the same ref waits.
  cancel-in-progress: false

jobs:
  # Runs on pull requests AND tag pushes. Least-privilege: read-only contents
  # scope. Builds amd64 + arm64 into the local daemon, then gates the push on
  # the Trivy CRITICAL/HIGH scan. PR runs end here — no elevated permission is
  # granted on a pull_request context, so no SARIF upload to Code Scanning.
  scan:
    name: Build and scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag

      - name: Build amd64 image for local scan (load into docker daemon)
        id: build-scan
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: false
          load: true
          platforms: linux/amd64
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}-scan
          labels: ${{ steps.meta.outputs.labels }}

      - name: Build arm64 image for local scan (load into docker daemon)
        id: build-scan-arm64
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: false
          load: true
          platforms: linux/arm64
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}-scan-arm64
          labels: ${{ steps.meta.outputs.labels }}

      # Both architectures are scanned before push; the published platforms
      # (linux/amd64, linux/arm64) must match the scanned surface exactly.
      - name: Install Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.74.0
          cache: true

      - name: Generate Trivy SARIF reports (amd64 + arm64)
        continue-on-error: true
        run: |
          trivy image \
            --scanners vuln \
            --severity CRITICAL,HIGH \
            --ignore-unfixed \
            --skip-version-check \
            --format sarif \
            --output trivy-results.sarif \
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}-scan"
          trivy image \
            --scanners vuln \
            --severity CRITICAL,HIGH \
            --ignore-unfixed \
            --skip-version-check \
            --format sarif \
            --output trivy-results-arm64.sarif \
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}-scan-arm64"

      - name: Scan with Trivy (gate — fail on CRITICAL/HIGH, both architectures)
        run: |
          trivy image \
            --scanners vuln \
            --severity CRITICAL,HIGH \
            --ignore-unfixed \
            --skip-version-check \
            --exit-code 1 \
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}-scan"
          trivy image \
            --scanners vuln \
            --severity CRITICAL,HIGH \
            --ignore-unfixed \
            --skip-version-check \
            --exit-code 1 \
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}-scan-arm64"

      # Hand the SARIF reports to the tag-only publish job, which carries the
      # security-events: write permission needed for Code Scanning upload.
      - name: Upload Trivy SARIF artifacts
        if: (!cancelled())
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trivy-sarif
          path: |
            trivy-results.sarif
            trivy-results-arm64.sarif
          retention-days: 7

  # Tag pushes only (pull requests never reach this job). Carries the elevated
  # permissions a release needs — packages, attestations, and security-events
  # writes — so they can never be exercised from a pull_request context.
  publish:
    name: Publish multi-arch image
    needs: scan
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # required for keyless Cosign
      attestations: write
      security-events: write # required for SARIF upload to GitHub Security tab
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag

      # Scan job produces the SARIF; a failure here aborts before any push, so
      # the rollback guard below never fires for a missing artifact.
      - name: Download Trivy SARIF artifacts
        id: download-sarif
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: trivy-sarif
          path: trivy-sarif

      - name: Build and push multi-arch (tag releases only)
        id: build-push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate SBOM (CycloneDX JSON)
        id: sbom
        if: steps.build-push.outputs.digest != ''
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}
          format: cyclonedx-json
          output-file: sbom.cdx.json

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign image by digest (keyless OIDC)
        if: steps.build-push.outputs.digest != ''
        env:
          DIGEST: ${{ steps.build-push.outputs.digest }}
          REGISTRY: ${{ env.REGISTRY }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
        run: |
          IMAGE="${REGISTRY}/${IMAGE_NAME}@${DIGEST}"
          cosign sign --yes "${IMAGE}"

      - name: Attach SBOM attestation by digest
        if: steps.build-push.outputs.digest != ''
        env:
          DIGEST: ${{ steps.build-push.outputs.digest }}
          REGISTRY: ${{ env.REGISTRY }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
        run: |
          IMAGE="${REGISTRY}/${IMAGE_NAME}@${DIGEST}"
          cosign attest --type cyclonedx --predicate sbom.cdx.json --yes "${IMAGE}"

      - name: Attest build provenance (SLSA)
        if: steps.build-push.outputs.digest != ''
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build-push.outputs.digest }}
          push-to-registry: true

      # Rollback: if signing/attestation/SBOM fails after publish, remove the
      # published version so a broken tag is never left unsigned. Placed before
      # the best-effort SARIF uploads so their failures cannot trigger it.
      - name: Rollback tag if post-push steps failed
        if: failure() && steps.build-push.outputs.digest != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          PACKAGE="orgs/${{ github.repository_owner }}/packages/container/caddy-waf"
          VERSION_ID="$(gh api "${PACKAGE}/versions" \
            | jq -r --arg ref "$REF_NAME" '.[] | select(.metadata.container.tags[]? == $ref) | .id' \
            | head -1)"
          if [ -n "$VERSION_ID" ]; then
            gh api -X DELETE "${PACKAGE}/versions/${VERSION_ID}" \
              -f confirm=true -H "Accept: application/vnd.github+json"
          else
            echo "::notice::Rollback skipped: no published version found for tag ${REF_NAME}"
          fi

      - name: Upload Trivy SARIF (amd64)
        if: (!cancelled()) && steps.build-push.outputs.digest != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@eec0bff2f6c15bf3f1e8a0152f94d17664a06a06 # v4
        with:
          sarif_file: trivy-sarif/trivy-results.sarif
          category: trivy

      - name: Upload Trivy SARIF (arm64)
        if: (!cancelled()) && steps.build-push.outputs.digest != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@eec0bff2f6c15bf3f1e8a0152f94d17664a06a06 # v4
        with:
          sarif_file: trivy-sarif/trivy-results-arm64.sarif
          category: trivy-arm64

      - name: Build summary
        if: success()
        env:
          REF_NAME: ${{ github.ref_name }}
          REGISTRY: ${{ env.REGISTRY }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
        run: |
          SUMMARY="$GITHUB_STEP_SUMMARY"
          {
            echo "## 🎉 Build Successful!"
            echo ""
            echo "**Version:** \`${REF_NAME}\`"
            echo "**Image:** \`${REGISTRY}/${IMAGE_NAME}:${REF_NAME}\`"
            echo "**Platforms:** \`linux/amd64\`, \`linux/arm64\`"
            echo ""
            echo "### 🐳 Pull Command"
            echo "\`\`\`bash"
            echo "docker pull ${REGISTRY}/${IMAGE_NAME}:${REF_NAME}"
            echo "\`\`\`"
          } >> "$SUMMARY"
