name: Build, Scan, Sign, and Push

on:
  push:
    tags: ["v*"]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: developmi/caddy-waf

permissions:
  contents: read
  packages: write
  id-token: write # required for keyless Cosign
  attestations: write
  security-events: write # required for SARIF upload to GitHub Security tab

jobs:
  build-scan-sign:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag

      - name: Build image for local scan (load into docker daemon)
        id: build-scan
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          push: false
          load: true
          platforms: linux/amd64
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}-scan
          labels: ${{ steps.meta.outputs.labels }}

      # ponytail: amd64-only scan. CRITICAL/HIGH vulns are arch-independent
      - name: Install Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.72.0
          cache: true

      - name: Generate Trivy SARIF report
        continue-on-error: true
        run: |
          trivy image \
            --scanners vuln \
            --severity CRITICAL,HIGH \
            --ignore-unfixed \
            --skip-version-check \
            --format sarif \
            --output trivy-results.sarif \
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}-scan"

      - name: Scan with Trivy (gate — fail on CRITICAL/HIGH)
        run: |
          trivy image \
            --scanners vuln \
            --severity CRITICAL,HIGH \
            --ignore-unfixed \
            --skip-version-check \
            --exit-code 1 \
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}-scan"

      - name: Upload Trivy SARIF
        if: (!cancelled()) && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@eec0bff2f6c15bf3f1e8a0152f94d17664a06a06 # v4
        with:
          sarif_file: trivy-results.sarif
          category: trivy

      - name: Build and push multi-arch (tag releases only)
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        id: build-push
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate SBOM (CycloneDX JSON)
        id: sbom
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}
          format: cyclonedx-json
          output-file: sbom.cdx.json

      - name: Install Cosign
        uses: sigstore/cosign-installer@f713795cb21599bc4e5c4b58cbad1da852d7eeb9 # v3

      - name: Sign image by digest (keyless OIDC)
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && steps.build-push.outputs.digest != ''
        env:
          DIGEST: ${{ steps.build-push.outputs.digest }}
          REGISTRY: ${{ env.REGISTRY }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
        run: |
          IMAGE="${REGISTRY}/${IMAGE_NAME}@${DIGEST}"
          cosign sign --yes "${IMAGE}"

      - name: Attach SBOM attestation by digest
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && steps.build-push.outputs.digest != ''
        env:
          DIGEST: ${{ steps.build-push.outputs.digest }}
          REGISTRY: ${{ env.REGISTRY }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
        run: |
          IMAGE="${REGISTRY}/${IMAGE_NAME}@${DIGEST}"
          cosign attest --type cyclonedx --predicate sbom.cdx.json --yes "${IMAGE}"

      - name: Attest build provenance (SLSA)
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45 # v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build-push.outputs.digest }}
          push-to-registry: true

      - name: Build summary
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        env:
          REF_NAME: ${{ github.ref_name }}
          REGISTRY: ${{ env.REGISTRY }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
        run: |
          SUMMARY="$GITHUB_STEP_SUMMARY"
          {
            echo "## 🎉 Build Successful!"
            echo ""
            echo "**Version:** \`${REF_NAME}\`"
            echo "**Image:** \`${REGISTRY}/${IMAGE_NAME}:${REF_NAME}\`"
            echo "**Platforms:** \`linux/amd64\`, \`linux/arm64\`"
            echo ""
            echo "### 🐳 Pull Command"
            echo "\`\`\`bash"
            echo "docker pull ${REGISTRY}/${IMAGE_NAME}:${REF_NAME}"
            echo "\`\`\`"
          } >> "$SUMMARY"
