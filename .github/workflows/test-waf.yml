name: Test WAF

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-waf:
    name: WAF integration tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run WAF integration tests
        run: |
          set -o pipefail
          make test-waf 2>&1 | tee go-ftw.log

      - name: Run container security scan (Trivy)
        run: make test-security

      - name: Run bare-boot regression test
        run: make test-boot

      - name: Run container kernel hardening asserts
        run: make test-kernel

      - name: Tear down test stack
        if: always()
        run: make test-clean

      - name: Upload go-ftw report on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: go-ftw-report
          path: go-ftw.log
          retention-days: 7
