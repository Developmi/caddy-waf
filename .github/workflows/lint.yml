name: Lint

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: false

      - name: Install system linters
        run: |
          # actionlint v1.7.12
          curl -fsSL "https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz" \
            | tar -xz -C /usr/local/bin actionlint
          chmod 755 /usr/local/bin/actionlint

          # hadolint v2.15.1
          curl -fsSL "https://github.com/hadolint/hadolint/releases/download/v2.15.1/hadolint-linux-x86_64" \
            -o /usr/local/bin/hadolint
          chmod 755 /usr/local/bin/hadolint

      - name: Sync Python dependencies
        run: uv sync --frozen

      - name: Lint YAML
        run: uv run yamllint .

      - name: Lint Dockerfile
        run: hadolint --failure-threshold warning Dockerfile

      - name: Lint GitHub Actions
        run: actionlint

      - name: Lint Actions Security
        run: uv run zizmor .
