# Test override for docker-compose.yml
# Starts caddy-waf with WAF in blocking mode on a dedicated port for integration testing.
# Usage: docker compose -f docker-compose.yml -f docker-compose.test.yml up -d --wait
---
services:
  caddy-waf:
    build: .
    image: caddy-waf:local
    container_name: caddy-waf-test
    ports:
      - "127.0.0.1:9090:80"
    volumes:
      - ./tests/Caddyfile.test:/etc/caddy/Caddyfile:ro
    environment:
      SITE_ADDRESS: "localhost"
      BACKEND_UPSTREAM: ""
