---
meta:
  author: "Developmi"
  description: "caddy-waf infrastructure and perimeter hardening suite"
  enabled: true
  name: "caddy-waf-hardening"

rule_id: 999005

tests:
  - test_title: "AWS cloud credentials probing - WAF should block"
    test_id: 1
    description: "CRS rule 930130. Access to /.aws/credentials triggers 403."
    stages:
      - stage:
          input:
            dest_addr: "127.0.0.1"
            port: 9090
            protocol: "http"
            uri: "/.aws/credentials"
            method: "GET"
            headers:
              User-Agent: "caddy-waf-test/1.0"
              Host: "localhost"
          output:
            status: [403]

