---
meta:
  author: "Developmi"
  description: "CRS 4.29.0 Rule 913100 - Security Scanner User-Agents"
  enabled: true
  name: "crs-913-scanner-detection"

rule_id: 913100

tests:
  - test_title: "Scanner User-Agent sqlmap - WAF should block"
    test_id: 1
    description: "User-Agent associated with sqlmap triggers rule 913100."
    stages:
      - stage:
          input:
            dest_addr: "127.0.0.1"
            port: 9090
            protocol: "http"
            uri: "/"
            method: "GET"
            headers:
              User-Agent: "sqlmap/1.5#stable (http://sqlmap.org)"
              Host: "localhost"
          output:
            status: [403]

  - test_title: "Scanner User-Agent Nikto - WAF should block"
    test_id: 2
    description: "User-Agent associated with Nikto triggers rule 913100."
    stages:
      - stage:
          input:
            dest_addr: "127.0.0.1"
            port: 9090
            protocol: "http"
            uri: "/"
            method: "GET"
            headers:
              User-Agent: "Mozilla/5.00 (Nikto/2.1.6) (Evasions:None) (Test:Port Check)"
              Host: "localhost"
          output:
            status: [403]

