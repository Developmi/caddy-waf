---
meta:
  author: "Developmi"
  description: "CRS 4.29.0 Family 941 - Cross-Site Scripting (XSS)"
  enabled: true
  name: "crs-941-attack-xss"

rule_id: 941000

tests:
  - test_title: "Classic script tag - WAF should block"
    test_id: 1
    description: "CRS rule 941110/941100. Classic <script> tag triggers 403."
    stages:
      - stage:
          input:
            dest_addr: "127.0.0.1"
            port: 9090
            protocol: "http"
            uri: "/?q=<script>alert(1)</script>"
            method: "GET"
            headers:
              User-Agent: "caddy-waf-test/1.0"
              Host: "localhost"
          output:
            status: [403]

  - test_title: "Image onerror event handler - WAF should block"
    test_id: 2
    description: "CRS rule 941120. onerror attribute vector triggers 403."
    stages:
      - stage:
          input:
            dest_addr: "127.0.0.1"
            port: 9090
            protocol: "http"
            uri: "/?img=<img%20src=x%20onerror=alert(1)>"
            method: "GET"
            headers:
              User-Agent: "caddy-waf-test/1.0"
              Host: "localhost"
          output:
            status: [403]

  - test_title: "Body onload event handler - WAF should block"
    test_id: 3
    description: "CRS rule 941120. onload attribute vector triggers 403."
    stages:
      - stage:
          input:
            dest_addr: "127.0.0.1"
            port: 9090
            protocol: "http"
            uri: "/?body=<body%20onload=alert('XSS')>"
            method: "GET"
            headers:
              User-Agent: "caddy-waf-test/1.0"
              Host: "localhost"
          output:
            status: [403]

  - test_title: "JavaScript URI scheme - WAF should block"
    test_id: 4
    description: "CRS rule 941150. javascript: pseudo-protocol triggers 403."
    stages:
      - stage:
          input:
            dest_addr: "127.0.0.1"
            port: 9090
            protocol: "http"
            uri: "/?link=javascript:alert(1)"
            method: "GET"
            headers:
              User-Agent: "caddy-waf-test/1.0"
              Host: "localhost"
          output:
            status: [403]

  - test_title: "Iframe injection vector - WAF should block"
    test_id: 5
    description: "CRS rule 941170. <iframe src=...> vector triggers 403."
    stages:
      - stage:
          input:
            dest_addr: "127.0.0.1"
            port: 9090
            protocol: "http"
            uri: "/?frame=<iframe%20src=javascript:alert(1)>"
            method: "GET"
            headers:
              User-Agent: "caddy-waf-test/1.0"
              Host: "localhost"
          output:
            status: [403]

  - test_title: "SVG onload injection - WAF should block"
    test_id: 6
    description: "CRS rule 941200/941120. <svg onload=...> vector triggers 403."
    stages:
      - stage:
          input:
            dest_addr: "127.0.0.1"
            port: 9090
            protocol: "http"
            uri: "/?svg=<svg/onload=alert(1)>"
            method: "GET"
            headers:
              User-Agent: "caddy-waf-test/1.0"
              Host: "localhost"
          output:
            status: [403]

  - test_title: "Document cookie access - WAF should block"
    test_id: 7
    description: "CRS rule 941320. Access to document.cookie triggers 403."
    stages:
      - stage:
          input:
            dest_addr: "127.0.0.1"
            port: 9090
            protocol: "http"
            uri: "/?x=document.cookie"
            method: "GET"
            headers:
              User-Agent: "caddy-waf-test/1.0"
              Host: "localhost"
          output:
            status: [403]

  - test_title: "Window location redirection - WAF should block"
    test_id: 8
    description: "CRS rule 941320. Manipulation of window.location triggers 403."
    stages:
      - stage:
          input:
            dest_addr: "127.0.0.1"
            port: 9090
            protocol: "http"
            uri: "/?redirect=window.location='http://evil.com'"
            method: "GET"
            headers:
              User-Agent: "caddy-waf-test/1.0"
              Host: "localhost"
          output:
            status: [403]

  - test_title: "HTML entity encoded script tag - WAF should block"
    test_id: 9
    description: "CRS rule 941110. Decoded HTML entity &lt;script&gt; triggers 403."
    stages:
      - stage:
          input:
            dest_addr: "127.0.0.1"
            port: 9090
            protocol: "http"
            uri: "/?payload=&lt;script&gt;alert(1)&lt;/script&gt;"
            method: "GET"
            headers:
              User-Agent: "caddy-waf-test/1.0"
              Host: "localhost"
          output:
            status: [403]

  - test_title: "XSS payload in POST body - WAF should block"
    test_id: 10
    description: "CRS rule 941110. XSS payload submitted in POST body triggers 403."
    stages:
      - stage:
          input:
            dest_addr: "127.0.0.1"
            port: 9090
            protocol: "http"
            uri: "/post"
            method: "POST"
            headers:
              User-Agent: "caddy-waf-test/1.0"
              Host: "localhost"
              Content-Type: "application/x-www-form-urlencoded"
            data: "comment=<script>alert(document.domain)</script>"
          output:
            status: [403]
