# Docker Compose example for Caddy WAF
# Documentation: https://github.com/Developmi/caddy-waf

services:
  caddy-waf:
    image: ${CADDY_WAF_IMAGE:-ghcr.io/developmi/caddy-waf:v3.3.2}
    container_name: caddy-waf
    user: "1337:1337"
    restart: unless-stopped
    # Resource limits
    mem_limit: 512m
    cpus: 1.0
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    tmpfs:
      - /tmp:size=64m,noexec,nosuid,nodev
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      # Mount your custom Caddyfile
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Persistent data for certificates
      - caddy_data:/data
      # Configuration storage
      - caddy_config:/config
    environment:
      # ACME email for Let's Encrypt certificates
      - ACME_EMAIL=${ACME_EMAIL:-}
      # Site address used by Caddyfile (localhost by default)
      - SITE_ADDRESS=${SITE_ADDRESS:-localhost}
      # Backend upstream used by Caddyfile
      - BACKEND_UPSTREAM=${BACKEND_UPSTREAM:-example-app:80}
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://127.0.0.1:2019/metrics || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - caddy-network

  # Example backend service (optional)
  example-app:
    image: ${EXAMPLE_APP_IMAGE:-containous/whoami:latest}
    container_name: example-app
    restart: unless-stopped
    networks:
      - caddy-network

  # =============================================================================
  # Observability profiles - NOT started by default, enable with --profile:
  #   VictoriaMetrics + Grafana: docker compose --profile observability-vm up -d
  #   Prometheus + Grafana:     docker compose --profile observability-prom up -d
  # Both backends scrape the same metrics/prometheus.yml from caddy-waf:2019.
  # SECURITY: port 2019 (Caddy admin /metrics) is never published to the host.
  # =============================================================================

  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.149.0
    container_name: victoriametrics
    restart: unless-stopped
    profiles: ["observability-vm"]
    # Official image runs as root by default; non-root needs a pre-chowned data
    # volume, out of scope for this profile.
    command:
      - "-promscrape.config=/etc/prometheus/prometheus.yml"
    volumes:
      - ./metrics/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - vmdata:/victoria-metrics-data
    mem_limit: 256m
    cpus: 0.5
    expose:
      - "8428"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8428/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - caddy-network

  prometheus:
    image: prom/prometheus:v3.13.2
    container_name: prometheus
    restart: unless-stopped
    profiles: ["observability-prom"]
    user: "nobody"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    volumes:
      - ./metrics/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    mem_limit: 256m
    cpus: 0.5
    expose:
      - "9090"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:9090/-/healthy || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - caddy-network

  grafana-vm:
    image: grafana/grafana:13.1.3
    container_name: grafana-vm
    restart: unless-stopped
    profiles: ["observability-vm"]
    # Anonymous read access so dashboards are viewable without login
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      # One datasource file per profile, always mounted at the same container path
      - ./grafana/provisioning/datasources/victoriametrics.yml:/etc/grafana/provisioning/datasources/datasource.yml:ro
      - ./grafana/provisioning/dashboards/dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_vm_data:/var/lib/grafana
    mem_limit: 256m
    cpus: 0.5
    # Loopback-only bind: dashboard reachable from this host, not the LAN
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      victoriametrics:
        condition: service_healthy
    networks:
      - caddy-network

  grafana-prom:
    image: grafana/grafana:13.1.3
    container_name: grafana-prom
    restart: unless-stopped
    profiles: ["observability-prom"]
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - ./grafana/provisioning/datasources/prometheus.yml:/etc/grafana/provisioning/datasources/datasource.yml:ro
      - ./grafana/provisioning/dashboards/dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_prom_data:/var/lib/grafana
    mem_limit: 256m
    cpus: 0.5
    ports:
      - "127.0.0.1:3001:3000"
    depends_on:
      prometheus:
        condition: service_healthy
    networks:
      - caddy-network

volumes:
  caddy_data:
  caddy_config:
  vmdata:
  promdata:
  grafana_vm_data:
  grafana_prom_data:

networks:
  caddy-network:
    driver: bridge
