# Docker Compose example for Caddy WAF
# Documentation: https://github.com/Miguel-DevOps/caddy-waf

services:
  caddy-waf:
    image: ${CADDY_WAF_IMAGE:-ghcr.io/miguel-devops/caddy-waf:v1.0.0}
    container_name: caddy-waf
    user: "1337:1337"
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    tmpfs:
      - /tmp:size=64m,noexec,nosuid,nodev
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      # Mount your custom Caddyfile
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Persistent data for certificates
      - caddy_data:/data
      # Configuration storage
      - caddy_config:/config
    environment:
      # ACME email for Let's Encrypt certificates
      - ACME_EMAIL=${ACME_EMAIL:-}
      # Site address used by Caddyfile (localhost by default)
      - SITE_ADDRESS=${SITE_ADDRESS:-localhost}
      # Backend upstream used by Caddyfile
      - BACKEND_UPSTREAM=${BACKEND_UPSTREAM:-example-app:80}
    healthcheck:
      test: ["CMD-SHELL", "pgrep caddy >/dev/null || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks:
      - caddy-network

  # Example backend service (optional)
  example-app:
    image: ${EXAMPLE_APP_IMAGE:-containous/whoami:latest}
    container_name: example-app
    restart: unless-stopped
    networks:
      - caddy-network

volumes:
  caddy_data:
  caddy_config:

networks:
  caddy-network:
    driver: bridge