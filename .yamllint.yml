extends: default

ignore: |
  tools/bin/
  .venv/

rules:
  document-start: disable

  truthy:
    allowed-values:
      - "true"
      - "false"
      - "on"
      - "off"

  line-length:
    max: 140
    allow-non-breakable-words: true

  comments:
    min-spaces-from-content: 1

  brackets:
    max-spaces-inside: 1

  indentation:
    indent-sequences: true

  empty-lines:
    max: 2

  trailing-spaces: enable

  new-line-at-end-of-file: enable
